# CI-гейты ML-сервиса (backend-plan.md, BE-0.6). Отдельный файл от
# backend-api-ci.yml: paths-фильтры в GitHub Actions работают только
# на уровне workflow, а триггеры у api/ и ml/ разные.
name: Backend ML CI

on:
  push:
    branches: [main]
    paths:
      - "ml/**"
      - ".github/workflows/backend-ml-ci.yml"
  pull_request:
    paths:
      - "ml/**"
      - ".github/workflows/backend-ml-ci.yml"

jobs:
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest tests/ -q
