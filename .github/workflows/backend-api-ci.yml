# CI-гейты Core API (backend-plan.md, BE-0.6). Отдельный workflow-файл на
# каждый backend-компонент (api/, ml/): paths-фильтры в GitHub Actions
# работают только на уровне workflow, а триггеры у api и ml разные.
#
# prisma validate не требует живой БД — DATABASE_URL нужен лишь как
# синтаксически валидный URL для резолва env() в schema.prisma.
name: Backend API CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/backend-api-ci.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/backend-api-ci.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      # package-lock.json сгенерирован npm 11 (локальная среда команды);
      # npm 10 из коробки node 22 считает его рассинхронизированным —
      # выравниваем мажор npm с локальным (та же причина, что в ci.yml).
      - name: Use npm 11 (lockfile generator version)
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate Prisma schema
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Build
        run: npm run build
