# CI-гейты frontend'а (frontend-plan.md §13.6, откладывались с FE-1).
# Тесты включают i18n-парность словарей (messages/parity.test.ts) и
# a11y-смоук на axe (src/test/a11y.test.tsx). Build здесь безопасен:
# в CI нет параллельного `next dev`, конфликт .next/ невозможен.
#
# bundlewatch и lighthouse-ci — последние два гейта из списка
# frontend-plan.md §4 (`bundlewatch-per-route`, `lighthouse-ci`). Пороги
# в bundlewatch.config.json/lighthouserc.json подобраны по реальным
# измерениям на этой кодовой базе (см. HANDOFF.md) — не произвольные.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # package-lock.json сгенерирован npm 11 (локальная среда команды);
      # npm 10 из коробки node 22 считает его рассинхронизированным из-за
      # optional peer @swc/helpers — выравниваем мажор npm с локальным.
      - name: Use npm 11 (lockfile generator version)
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & component tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Bundle size budget
        run: npm run bundlewatch

      # playwright-smoke — последний гейт из frontend-plan.md §4. В CI гоняется
      # только chromium (гейт = P0-флоу + живой axe + вьюпорты); полная
      # кросс-браузерная матрица (firefox/webkit, NFR-23) — локальный
      # `npm run e2e:all`. webServer Playwright'а сам стартует production-сервер
      # (`next start`) из уже собранного .next/ (шаг build выше).
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke (P0 flows, live axe, viewports)
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Lighthouse CI (performance/a11y/SEO)
        run: npm run lighthouse
