# Локальные зависимости backend-разработки (BE-0.2, Epic 1.2):
#   docker compose -f infra/docker-compose.yml up -d
# Prod-окружение — UZ дата-центр (ADR-004), эти сервисы разворачиваются там же.
name: carsale-infra

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: carsale
      POSTGRES_PASSWORD: carsale
      POSTGRES_DB: carsale
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carsale"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: carsale
      RABBITMQ_DEFAULT_PASS: carsale
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: carsale
      MINIO_ROOT_PASSWORD: carsale-secret
    ports:
      - "9000:9000"
      - "9001:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Бакеты фото: originals — private, blurred — public-read (BR-3)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 carsale carsale-secret &&
      mc mb -p local/photos-originals local/photos-blurred &&
      mc anonymous set download local/photos-blurred
      "

volumes:
  pg_data:
  minio_data:
